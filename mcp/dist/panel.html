<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conductor</title>
<style>
/* Conductor panel — product styles for the MCP App surface. */
:root { color-scheme: light dark; }
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  color: var(--czp-text);
  background: var(--czp-panel-bg);
  text-align: left;
}
:root {
  --czp-panel-bg: light-dark(#ffffff, #17171c);
  --czp-border: light-dark(#d8dee5, #26262c);
  --czp-text: light-dark(#1f2328, #e8e8ec);
  --czp-muted: light-dark(#5b6771, #9b9ba6);
  --czp-accent: light-dark(#6d28d9, #a78bfa);
  --czp-accent-fg: light-dark(#ffffff, #17103a);
  --czp-accent-soft: color-mix(in srgb, var(--czp-accent) 10%, transparent);
  --czp-green: light-dark(#1a7f37, #3fb950);
  --czp-blue: light-dark(#0969da, #58a6ff);
  --czp-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
}
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; padding: 0; }
code { font-family: var(--czp-mono); }

.banner {
  display: none; margin: 12px; padding: 10px 12px; border-radius: 10px;
  border: 1px solid color-mix(in srgb, var(--czp-accent) 35%, transparent);
  background: var(--czp-accent-soft); font-size: 12.5px;
}
.banner.show { display: block; }
.banner button { color: var(--czp-accent); font-weight: 500; margin-top: 4px; }

.toast {
  position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
  background: var(--czp-text); color: var(--czp-panel-bg);
  border-radius: 9px; padding: 7px 13px; font-size: 12px; max-width: 90%;
  opacity: 0; pointer-events: none; transition: opacity .18s;
}
.toast.show { opacity: .96; }

.docktabs { display: flex; gap: 2px; padding: 6px 10px 0; border-bottom: 1px solid var(--czp-border); }
.docktab {
  display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px 8px;
  font-size: 12.5px; color: var(--czp-muted); border-bottom: 2px solid transparent; margin-bottom: -1px;
}
.docktab[aria-selected="true"] { color: var(--czp-text); border-bottom-color: var(--czp-accent); }
.tabcount { font-size: 10.5px; min-width: 17px; text-align: center; padding: 1px 5px; border-radius: 99px; background: var(--czp-accent-soft); color: var(--czp-accent); }
.tabcount[hidden] { display: none; }
.view[hidden] { display: none; }

.panelhead { display: flex; align-items: center; gap: 8px; padding: 12px 16px 0; }
.health { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--czp-muted); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--czp-green); flex: none; }
.dot.warn { background: var(--czp-accent); }
.newtrack { margin-left: auto; display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--czp-accent); padding: 4px 9px; border-radius: 7px; }
.newtrack:hover { background: var(--czp-accent-soft); }

.summary { display: flex; align-items: center; gap: 14px; padding: 12px 16px 14px; }
.pct { font-size: 26px; font-weight: 500; letter-spacing: -0.5px; font-variant-numeric: tabular-nums; }
.sumright { flex: 1; min-width: 0; }
.sumline { font-size: 12px; color: var(--czp-muted); margin-bottom: 6px; }
.sumline strong { color: var(--czp-green); font-weight: 500; }
.bar { height: 5px; border-radius: 99px; background: color-mix(in srgb, var(--czp-muted) 22%, transparent); overflow: hidden; }
.bar > span { display: block; height: 100%; border-radius: 99px; background: var(--czp-accent); }

.section { padding: 8px 16px 6px; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--czp-muted); border-top: 1px solid var(--czp-border); }
.tracklist { padding: 0 10px; display: flex; flex-direction: column; gap: 2px; }
.trackrow { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 8px 10px; border-radius: 9px; border: 1px solid transparent; }
.trackrow:hover { background: var(--czp-accent-soft); }
.trackrow.is-selected { border-color: color-mix(in srgb, var(--czp-accent) 45%, transparent); background: var(--czp-accent-soft); }
.status { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.status.s-done { background: var(--czp-green); }
.status.s-active { background: var(--czp-blue); box-shadow: 0 0 0 3px color-mix(in srgb, var(--czp-blue) 20%, transparent); }
.status.s-planned { background: transparent; border: 1.5px solid var(--czp-muted); }
.trackmain { flex: 1; min-width: 0; }
.trackname { display: block; font-weight: 500; font-family: var(--czp-mono); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.trackmeta { display: block; font-size: 11.5px; color: var(--czp-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mini { display: block; height: 3px; border-radius: 99px; margin-top: 5px; background: color-mix(in srgb, var(--czp-muted) 22%, transparent); overflow: hidden; }
.mini > span { display: block; height: 100%; border-radius: 99px; }
.mini .m-done { background: var(--czp-green); }
.mini .m-active { background: var(--czp-blue); }
.mini .m-planned { background: var(--czp-muted); opacity: .4; }
.trackside { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex: none; }
.chip { font-size: 10.5px; padding: 1.5px 8px; border-radius: 99px; white-space: nowrap; }
.chip.c-done { color: var(--czp-green); background: color-mix(in srgb, var(--czp-green) 12%, transparent); }
.chip.c-active { color: var(--czp-blue); background: color-mix(in srgb, var(--czp-blue) 12%, transparent); }
.chip.c-planned { color: var(--czp-muted); background: color-mix(in srgb, var(--czp-muted) 14%, transparent); }
.trackcount { font-size: 11px; color: var(--czp-muted); font-variant-numeric: tabular-nums; }
.handofftag { font-size: 10px; color: var(--czp-accent); border: 1px dashed color-mix(in srgb, var(--czp-accent) 50%, transparent); border-radius: 5px; padding: 0.5px 5px; }

.detail { padding: 4px 16px 8px; }
.detail-title { font-weight: 500; font-size: 13.5px; margin-bottom: 3px; }
.detail-spec { font-size: 12px; color: var(--czp-muted); margin-bottom: 12px; }
.handoff { display: flex; gap: 10px; align-items: flex-start; border: 1px solid color-mix(in srgb, var(--czp-accent) 35%, transparent); background: var(--czp-accent-soft); border-radius: 10px; padding: 10px 12px; margin-bottom: 14px; }
.handoff-body { flex: 1; min-width: 0; }
.handoff-head { font-size: 12px; font-weight: 500; margin-bottom: 2px; }
.handoff-resume { font-size: 12px; }
.handoff-gotcha { font-size: 11px; color: var(--czp-muted); margin-top: 3px; }
.resume-btn { flex: none; display: inline-flex; align-items: center; gap: 5px; align-self: center; font-size: 12px; padding: 5px 11px; border-radius: 8px; background: var(--czp-accent); color: var(--czp-accent-fg); font-weight: 500; }
.donecall { font-size: 12px; color: var(--czp-green); margin-bottom: 12px; display: flex; align-items: center; gap: 7px; }

.dtabs { display: flex; gap: 2px; margin: 2px 0 10px; }
.dtab { display: inline-flex; align-items: center; gap: 6px; font-family: var(--czp-mono); font-size: 11px; color: var(--czp-muted); padding: 3px 9px; border-radius: 7px; border: 1px solid transparent; }
.dtab:hover { color: var(--czp-text); }
.dtab[aria-selected="true"] { color: var(--czp-text); background: color-mix(in srgb, var(--czp-muted) 14%, transparent); }
.dtabn { font-size: 9.5px; min-width: 14px; text-align: center; border-radius: 99px; padding: 0 4px; background: color-mix(in srgb, var(--czp-blue) 16%, transparent); color: var(--czp-blue); }

.phase { margin-bottom: 12px; }
.phase-head { display: flex; align-items: baseline; gap: 8px; padding-bottom: 5px; margin-bottom: 4px; border-bottom: 1px solid var(--czp-border); }
.phase-name { font-weight: 500; font-size: 12.5px; }
.phase-count { margin-left: auto; font-size: 11px; color: var(--czp-muted); font-variant-numeric: tabular-nums; }
.tasks, ul.tasks { list-style: none; margin: 0; padding: 0; }
.task { display: flex; align-items: center; gap: 9px; padding: 4.5px 6px; border-radius: 7px; }
.task.t-active { background: color-mix(in srgb, var(--czp-blue) 9%, transparent); }
.task.sub .tasklabel { font-size: 11.5px; color: var(--czp-muted); padding-left: 20px; }
.cb { width: 14px; height: 14px; border-radius: 4px; flex: none; position: relative; border: 1.5px solid color-mix(in srgb, var(--czp-muted) 70%, transparent); }
.task.t-done .cb { background: var(--czp-green); border-color: var(--czp-green); }
.task.t-done .cb::after { content: ""; position: absolute; left: 3.5px; top: 1.5px; width: 4px; height: 7px; border-right: 1.8px solid light-dark(#fff, #0e1512); border-bottom: 1.8px solid light-dark(#fff, #0e1512); transform: rotate(45deg); }
.task.t-active .cb { border-color: var(--czp-blue); background: linear-gradient(to right, var(--czp-blue) 50%, transparent 50%); }
.tasklabel { flex: 1; min-width: 0; font-size: 12.5px; overflow-wrap: anywhere; }
.task.t-done .tasklabel { color: var(--czp-muted); }
.task.t-active .tasklabel { font-weight: 500; }
.sha { font-family: var(--czp-mono); font-size: 10.5px; color: var(--czp-muted); flex: none; background: color-mix(in srgb, var(--czp-muted) 14%, transparent); border-radius: 5px; padding: 1px 6px; }
.sha:hover { color: var(--czp-text); background: var(--czp-accent-soft); }
:root { --czp-red: light-dark(#b62324, #f85149); }
.diffrow { margin: -2px 0 8px 14px; }
.diffbox { border: 1px solid var(--czp-border); border-radius: 8px; overflow: hidden; }
.diffmsg { padding: 6px 10px; font-size: 11px; color: var(--czp-muted); white-space: pre-wrap; border-bottom: 1px solid var(--czp-border); background: color-mix(in srgb, var(--czp-muted) 8%, transparent); }
pre.diff { margin: 0; padding: 8px 10px; font-family: var(--czp-mono); font-size: 10.5px; line-height: 1.5; overflow: auto; max-height: 280px; background: color-mix(in srgb, var(--czp-muted) 6%, transparent); }
.d-add { color: var(--czp-green); background: color-mix(in srgb, var(--czp-green) 10%, transparent); display: inline-block; width: 100%; }
.d-del { color: var(--czp-red); background: color-mix(in srgb, var(--czp-red) 10%, transparent); display: inline-block; width: 100%; }
.d-hunk { color: var(--czp-accent); display: inline-block; width: 100%; }
.diffcut { padding: 4px 10px; font-size: 10.5px; border-top: 1px solid var(--czp-border); }
.diffact { display: flex; gap: 8px; padding: 6px 10px; border-top: 1px solid var(--czp-border); align-items: center; }
.nowchip { flex: none; font-size: 10px; font-weight: 500; color: var(--czp-blue); background: color-mix(in srgb, var(--czp-blue) 14%, transparent); border-radius: 99px; padding: 1px 7px; }

.cbubble { flex: none; display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 6px; font-size: 10px; color: var(--czp-muted); border: 1px solid var(--czp-border); opacity: 0; }
.task:hover .cbubble, .task:focus-within .cbubble, .cbubble.has { opacity: 1; }
.cbubble.has { color: var(--czp-blue); border-color: color-mix(in srgb, var(--czp-blue) 40%, transparent); background: color-mix(in srgb, var(--czp-blue) 10%, transparent); }
.cbubble.resolved { color: var(--czp-green); border-color: color-mix(in srgb, var(--czp-green) 40%, transparent); background: color-mix(in srgb, var(--czp-green) 10%, transparent); }
.cbubble:hover { color: var(--czp-text); }
.thread { margin: -2px 0 8px 14px; padding: 8px 10px; border-left: 2px solid var(--czp-accent); border-radius: 0 8px 8px 0; background: color-mix(in srgb, var(--czp-muted) 7%, transparent); }
.thread.is-resolved { border-left-color: var(--czp-green); opacity: .85; }
.cmt { margin-bottom: 7px; }
.cmt-head { display: flex; gap: 7px; align-items: baseline; font-size: 11px; }
.cmt-author { font-weight: 500; }
.cmt-when { color: var(--czp-muted); font-size: 10.5px; }
.cmt-text { font-size: 12px; margin-top: 1px; overflow-wrap: anywhere; }
.cmtrow { display: flex; gap: 6px; margin-top: 4px; }
.cmtrow input { flex: 1; min-width: 0; font: inherit; font-size: 12px; color: var(--czp-text); background: var(--czp-panel-bg); border: 1px solid var(--czp-border); border-radius: 7px; padding: 4px 9px; }
.cmtrow input:focus { outline: 2px solid var(--czp-accent); outline-offset: -1px; }
.cmtbtn { font-size: 11px; padding: 3px 9px; border-radius: 7px; border: 1px solid var(--czp-border); color: var(--czp-muted); flex: none; }
.cmtbtn:hover { color: var(--czp-text); background: var(--czp-accent-soft); }

.spechead { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.spechead code { font-size: 10.5px; color: var(--czp-muted); background: color-mix(in srgb, var(--czp-muted) 12%, transparent); border-radius: 5px; padding: 1px 7px; }
.spec h4 { margin: 12px 0 4px; font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--czp-muted); font-weight: 500; }
.spec p { margin: 0 0 6px; font-size: 12.5px; }
.spec ul { margin: 0 0 6px; padding-left: 17px; }
.spec li { font-size: 12.5px; margin: 2.5px 0; }
.spec pre { margin: 0 0 6px; padding: 8px 10px; background: color-mix(in srgb, var(--czp-muted) 10%, transparent); border-radius: 8px; overflow-x: auto; font-family: var(--czp-mono); font-size: 11px; }
.spec code { font-size: 11.5px; }
.specnote { font-size: 11px; color: var(--czp-muted); }

.actions { display: flex; align-items: center; gap: 8px; margin-top: auto; padding: 12px 16px 14px; border-top: 1px solid var(--czp-border); position: sticky; bottom: 0; background: var(--czp-panel-bg); }
.primary { display: inline-flex; align-items: center; gap: 7px; flex: 1; justify-content: center; font-size: 12.5px; font-weight: 500; padding: 8px 12px; border-radius: 9px; background: var(--czp-accent); color: var(--czp-accent-fg); }
.primary[disabled] { opacity: .45; cursor: default; }
.ghosticon { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 9px; border: 1px solid var(--czp-border); color: var(--czp-muted); }
.ghosticon:hover:not([disabled]) { color: var(--czp-text); background: var(--czp-accent-soft); }
.ghosticon[disabled] { opacity: .35; cursor: default; }

.newdraft { margin: 10px 16px 0; padding: 12px; border: 1px solid color-mix(in srgb, var(--czp-accent) 35%, transparent); background: var(--czp-accent-soft); border-radius: 10px; }
.newdraft[hidden] { display: none; }
.newdraft-head { display: flex; align-items: center; font-weight: 500; font-size: 13px; margin-bottom: 8px; }
.newdraft-close { margin-left: auto; color: var(--czp-muted); display: grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; }
.newdraft-close:hover { color: var(--czp-text); }
.newdraft input[type="text"] { width: 100%; font: inherit; font-size: 12.5px; color: var(--czp-text); background: var(--czp-panel-bg); border: 1px solid var(--czp-border); border-radius: 8px; padding: 7px 10px; }
.newdraft input[type="text"]:focus { outline: 2px solid var(--czp-accent); outline-offset: -1px; }
.newdraft-types { display: flex; gap: 6px; margin-top: 8px; }
.typechip { font-size: 11.5px; padding: 3px 11px; border-radius: 99px; border: 1px solid var(--czp-border); color: var(--czp-muted); background: var(--czp-panel-bg); }
.typechip.is-on { border-color: var(--czp-accent); color: var(--czp-accent); background: color-mix(in srgb, var(--czp-accent) 10%, transparent); }
.newdraft-hint { font-size: 11px; color: var(--czp-muted); margin: 8px 0 10px; }
.newdraft .primary { width: 100%; }

.tlwrap { padding: 6px 16px 16px; }
.tlmeta { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--czp-muted); margin-bottom: 12px; flex-wrap: wrap; }
.vel { display: inline-flex; align-items: center; gap: 5px; }
.tllegend { margin-left: auto; display: inline-flex; gap: 11px; align-items: center; }
.lg { display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; color: var(--czp-muted); }
.lg-swatch { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.lg-done { background: var(--czp-green); opacity: .6; }
.lg-commit { background: var(--czp-blue); border-radius: 50%; width: 8px; height: 8px; }
.lg-hand { width: 8px; height: 8px; transform: rotate(45deg); background: var(--czp-accent); border-radius: 2px; }
.tl { position: relative; --tl-label-w: 96px; }
.tl-row { display: flex; align-items: center; height: 30px; }
.tl-headrow { height: 20px; }
.tl-label { width: var(--tl-label-w); flex: none; font-family: var(--czp-mono); font-size: 11px; color: var(--czp-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 8px; }
.tl-track { flex: 1; position: relative; height: 100%; border-left: 1px solid var(--czp-border); }
.tl-day { position: absolute; top: 1px; font-size: 10px; color: var(--czp-muted); transform: translateX(-50%); white-space: nowrap; }
.tl-day.d-first { transform: none; }
.tl-day.d-last { transform: translateX(-100%); }
  .tl-span { position: absolute; top: 9px; height: 12px; border-radius: 6px; }
  .tl-span.done { background: var(--czp-green); opacity: .5; }
  .tl-span.active { background: var(--czp-blue); opacity: .8; }
  .tl-span.planned { background: color-mix(in srgb, var(--czp-accent) 14%, transparent); border: 1px dashed color-mix(in srgb, var(--czp-accent) 55%, transparent); opacity: 1; }
  .tl-nocommits { position: absolute; left: 4px; top: 8px; font-size: 10px; color: var(--czp-muted); opacity: .8; }
.tl-commit { position: absolute; top: 11px; width: 8px; height: 8px; border-radius: 50%; background: var(--czp-blue); transform: translateX(-50%); }
.tl-hand { position: absolute; top: 11px; width: 8px; height: 8px; transform: translateX(-50%) rotate(45deg); background: var(--czp-accent); border-radius: 2px; }
.tl-today { position: absolute; top: 20px; bottom: 0; width: 0; opacity: .65; border-left: 1.5px dashed var(--czp-accent); }
  .tl-empty { font-size: 12px; color: var(--czp-muted); padding: 10px 0; }
  .tl-note { font-size: 11px; color: var(--czp-muted); margin-top: 10px; }
  .shipped { margin-top: 14px; border-top: 1px solid var(--czp-border); padding-top: 8px; }
  .shipped-head { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--czp-muted); margin-bottom: 5px; }
  .shipped-item { display: flex; gap: 8px; align-items: baseline; padding: 2.5px 0; font-size: 12px; }
  .shipped-date { font-family: var(--czp-mono); font-size: 10.5px; color: var(--czp-muted); flex: none; }
  .shipped-id { font-family: var(--czp-mono); font-size: 11px; flex: none; }
  .shipped-title { color: var(--czp-muted); overflow-wrap: anywhere; }
@media (max-width: 480px) { .tl { --tl-label-w: 72px; } .tl-day:nth-child(2n) { display: none; } }

  .archwrap { padding: 4px 0 16px; }
  .archhead { padding: 10px 16px 6px; font-size: 12px; color: var(--czp-muted); }
  .archhead code { font-family: var(--czp-mono); font-size: 11px; }
  .cand { border: 1px solid var(--czp-border); border-radius: 10px; padding: 10px 12px; margin: 0 16px 10px; }
  .cand-head { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .cand-id { font-family: var(--czp-mono); font-size: 11px; color: var(--czp-muted); flex: none; }
  .cand-title { font-weight: 500; font-size: 12.5px; flex: 1; min-width: 0; }
  .chip.s-strong { color: var(--czp-green); background: color-mix(in srgb, var(--czp-green) 12%, transparent); }
  .chip.s-worth { color: var(--czp-accent); background: color-mix(in srgb, var(--czp-accent) 12%, transparent); }
  .chip.s-spec { color: var(--czp-muted); background: color-mix(in srgb, var(--czp-muted) 14%, transparent); }
  .cand-files { font-family: var(--czp-mono); font-size: 10.5px; color: var(--czp-muted); margin-bottom: 4px; overflow-wrap: anywhere; }
  .cand-line { font-size: 12px; margin-bottom: 3px; overflow-wrap: anywhere; }
  .cand-line b { font-weight: 500; }
  .cand-actions { display: flex; gap: 6px; margin-top: 8px; }
  .cand-btn { font-size: 11.5px; padding: 4px 10px; border-radius: 7px; border: 1px solid var(--czp-border); color: var(--czp-muted); }
  .cand-btn:hover { color: var(--czp-text); background: var(--czp-accent-soft); }
  .cand-dispo { font-size: 11px; color: var(--czp-muted); margin-top: 6px; }

  .todosview { padding: 12px 16px; }
.todoshead { font-size: 12px; color: var(--czp-muted); margin-bottom: 10px; }
.todoshead strong { color: var(--czp-text); font-weight: 500; }
.todomirror { border: 1px solid var(--czp-border); border-radius: 10px; overflow: hidden; }
.todomirror .task { border-bottom: 1px solid var(--czp-border); border-radius: 0; padding: 7px 11px; }
.todomirror .task:last-child { border-bottom: none; }
.todonote { font-size: 11px; color: var(--czp-muted); margin-top: 9px; }

.muted { color: var(--czp-muted); }
.spin { display: inline-block; width: 13px; height: 13px; border: 2px solid var(--czp-accent); border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: -2px; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }

</style>
</head>
<body>
<div id="app">
  <div class="banner" id="banner"></div>

  <div class="docktabs" role="tablist" aria-label="Conductor views">
    <button class="docktab" id="tab-conductor" role="tab" type="button" aria-selected="true" data-tab="conductor" aria-controls="view-conductor">Conductor</button>
    <button class="docktab" id="tab-timeline" role="tab" type="button" aria-selected="false" data-tab="timeline" aria-controls="view-timeline">Timeline</button>
    <button class="docktab" id="tab-architecture" role="tab" type="button" aria-selected="false" data-tab="architecture" aria-controls="view-architecture">Architecture<span class="tabcount" id="tabArchCount" hidden>0</span></button>
    <button class="docktab" id="tab-todos" role="tab" type="button" aria-selected="false" data-tab="todos" aria-controls="view-todos">Todos<span class="tabcount" id="tabTodosCount" hidden>0</span></button>
    <button class="docktab" id="refreshBtn" type="button" title="Refresh" aria-label="Refresh" style="margin-left:auto">Refresh</button>
  </div>

  <div class="view" id="view-conductor" role="tabpanel" aria-labelledby="tab-conductor">
    <div class="panelhead">
      <span class="health" id="health"></span>
      <button class="newtrack" id="newtrack" type="button" title="Create a track — interview + draft via conductor-new-track">New track</button>
    </div>
    <div class="summary" id="summary"></div>

    <div class="newdraft" id="newdraft" hidden>
      <div class="newdraft-head">New track<button class="newdraft-close" id="draft-close" type="button" aria-label="Close"></button></div>
      <input type="text" id="draft-idea" placeholder="What should the track do? e.g. Order tracking page" aria-label="Track idea">
      <div class="newdraft-types" id="draft-types" role="group" aria-label="Track type">
        <button class="typechip is-on" type="button" data-type="Feature">Feature</button>
        <button class="typechip" type="button" data-type="Bug">Bug</button>
        <button class="typechip" type="button" data-type="Chore">Chore</button>
      </div>
      <div class="newdraft-hint">ZCode interviews you in chat, then drafts <code>spec.md</code> + <code>plan.md</code> — nothing lands until you approve the plan.</div>
      <button class="primary" id="draft-go" type="button"><span>Draft spec &amp; plan</span></button>
    </div>

    <div class="section">Tracks · conductor/tracks.md</div>
    <div class="tracklist" id="tracklist"></div>
    <div id="detail"></div>

    <div class="actions">
      <button class="primary" id="primaryBtn" type="button"><span id="primaryLabel">Implement next task</span></button>
      <button class="ghosticon" id="btnReview" type="button" title="conductor:review — principal-engineer review" aria-label="Review"></button>
      <button class="ghosticon" id="btnHandoff" type="button" title="conductor:handoff — snapshot session state" aria-label="Handoff"></button>
      <button class="ghosticon" id="btnRevert" type="button" title="conductor:revert — git-aware revert" aria-label="Revert"></button>
    </div>
  </div>

  <div class="view" id="view-timeline" role="tabpanel" aria-labelledby="tab-timeline" hidden>
    <div class="tlwrap">
      <div class="tlmeta">
        <span class="vel" id="velIcon"></span>
        <span>Commit dates from plan.md SHAs, one lane per track</span>
            <span class="tllegend">
              <span class="lg"><span class="lg-swatch lg-done"></span>track activity</span>
              <span class="lg"><span class="lg-swatch lg-commit"></span>task</span>
              <span class="lg"><span class="lg-swatch lg-hand"></span>handoff</span>
            </span>
      </div>
      <div class="tl" id="timeline" role="img" aria-label="Track timeline, one lane per track"></div>
    </div>
  </div>

  <div class="view" id="view-architecture" role="tabpanel" aria-labelledby="tab-architecture" hidden>
    <div class="archwrap" id="architecture"></div>
  </div>

  <div class="view" id="view-todos" role="tabpanel" aria-labelledby="tab-todos" hidden>
    <div id="todos"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
